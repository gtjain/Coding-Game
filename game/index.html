<meta charset="utf-8">
<title>Code Hoppers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: sticky top bar (timer, player, grown-ups); home = players + path; deck = one flash card at a time with Back / Next. Single bright look on purpose (kids' game). */
:root{
  --sky:#E6F2FF; --card:#FFFFFF; --ink:#1D2846; --muted:#55628A; --line:#D3E1F3; --soft:#F7FAFF;
  --grass:#2BAE66; --grassDk:#1C8049; --sun:#FFC23C; --sunDk:#D39600;
  --coral:#FF6150; --coralDk:#C63E2E; --grape:#7559FF; --grapeDk:#5137D4;
  --field:#E3F5D6; --fieldLine:#C7E6B1; --sea:#3D8BFF; --seaDk:#1F66D6;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--grape);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:2px solid var(--line)}
.topin{max-width:1100px;margin:0 auto;padding-block:10px;padding-inline:16px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:22px;font-weight:800}
.logo{display:grid;grid-template-columns:repeat(2,12px);gap:3px}
.logo i{width:12px;height:12px;border-radius:4px;background:var(--grass)}
.logo i:nth-child(2){background:var(--sun)}.logo i:nth-child(3){background:var(--grape)}.logo i:nth-child(4){background:var(--coral)}
.tag{font-family:var(--body);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--grapeDk);background:#EEEAFF;border-radius:999px;padding:3px 10px}
.topright{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipbtn{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:14px;padding:6px 10px;font-weight:800;font-size:15px}
.chipbtn .av{font-size:20px}
.timer{font-variant-numeric:tabular-nums}
.timer.over{background:#FFE2DE;border-color:var(--coral);color:var(--coralDk)}
.stat{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.tabs{max-width:1100px;margin:0 auto;padding-inline:16px;display:flex;gap:6px;overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:800;color:var(--muted);border-bottom:4px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-color:var(--grass)}

main{max-width:1100px;margin:0 auto;padding-block:24px 64px;padding-inline:16px}
.intro{max-width:68ch;margin-bottom:22px}
.intro h2{font-size:30px;margin-bottom:6px}
.intro p{margin:0 0 6px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.unithead{grid-column:1/-1;font-family:var(--display);font-size:22px;margin-top:8px}

/* cards */
.card,.panel{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0;position:relative}
.ghead{display:flex;gap:12px;align-items:center}
.code{font-family:var(--display);font-weight:800;font-size:17px;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;color:#fff;background:var(--grass);flex:none}
.card[data-tier="older"] .code{background:var(--grape)}
.ghead h3{font-size:24px}
.newtag{font-family:var(--body);font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--sun);color:var(--ink);border-radius:999px;padding:2px 8px;vertical-align:middle}
.skill{margin:0;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.speak{margin-left:auto;flex:none;width:44px;height:44px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-size:20px}
.how{margin:0;color:var(--muted)}
.play{display:flex;flex-direction:column;gap:12px;align-items:center}
.hearts{align-self:flex-end;font-size:18px;letter-spacing:2px;min-height:24px}
.notes{border-top:2px dashed var(--line);padding-top:10px;font-size:14px;color:var(--muted)}
.notes summary{font-weight:800;color:var(--ink);cursor:pointer}
.notes ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px}

/* chunky buttons */
.btn{border:0;border-radius:16px;padding:12px 20px;font-weight:800;font-size:17px;color:#fff;background:var(--grass);box-shadow:0 4px 0 var(--grassDk);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--grassDk)}
.btn.warn{background:var(--coral);box-shadow:0 4px 0 var(--coralDk)}
.btn.alt{background:var(--sea);box-shadow:0 4px 0 var(--seaDk)}
.btn.ghost{background:var(--card);color:var(--muted);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.small{padding:9px 14px;font-size:15px}
.btn:disabled{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* board: rows and columns are forced equal so one arrow = exactly one square */
.boardHost{width:100%;display:flex;justify-content:center}
.board{position:relative;display:grid;grid-template-columns:repeat(var(--w),minmax(0,1fr));grid-template-rows:repeat(var(--h),minmax(0,1fr));width:min(100%,var(--bw,320px));aspect-ratio:var(--w)/var(--h);background:var(--field);border-radius:18px;overflow:hidden;border:3px solid var(--fieldLine);container-type:inline-size}
.cell{border:1px solid var(--fieldLine);display:grid;place-items:center;font-size:calc(100cqw / var(--w) * .58);line-height:1;overflow:hidden;min-width:0;min-height:0}
.cell.wall{background:#CFE9BD}
.board.pick .cell{cursor:pointer}
.cell.picked{background:#FFE9A8}
.cell.right{background:#BFF0D4;box-shadow:inset 0 0 0 3px var(--grass)}
.sprite{position:absolute;display:grid;place-items:center;font-size:calc(100cqw / var(--w) * .62);line-height:1;width:calc(100% / var(--w));height:calc(100% / var(--h));transition:left .32s ease,top .32s ease;z-index:2;pointer-events:none}
.sprite.bump{animation:wobble .45s}
.sprite.win{animation:hop .6s 2}
@keyframes wobble{25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
@keyframes hop{50%{transform:translateY(-30%) scale(1.15)}}

/* program trays and blocks */
.tray{width:100%;min-height:68px;border:3px dashed var(--line);border-radius:16px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;align-content:flex-start;background:var(--soft)}
.tray.active{border-color:var(--grape);background:#F3F0FF}
.tray:empty::before{content:attr(data-empty);color:var(--muted);font-weight:700;font-size:14px;padding-left:4px}
.tray.readonly{border-style:solid;justify-content:center}
.blk{width:48px;height:48px;border-radius:12px;border:0;background:var(--grape);box-shadow:0 4px 0 var(--grapeDk);color:#fff;font-family:var(--display);font-weight:800;font-size:28px;display:grid;place-items:center;line-height:1}
.blk.big{width:64px;height:64px;font-size:36px}
.blk.call{background:var(--grass);box-shadow:0 4px 0 var(--grassDk)}
.blk.now{background:var(--sun);box-shadow:0 4px 0 var(--sunDk);color:var(--ink)}
.blk.bad{background:var(--coral);box-shadow:0 4px 0 var(--coralDk)}
.palette{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.palette .blk{background:var(--sea);box-shadow:0 4px 0 var(--seaDk)}
.palette .wide{width:auto;padding:0 14px;font-size:18px}
.palette .loopbtn{background:var(--sun);box-shadow:0 4px 0 var(--sunDk);color:var(--ink)}
.palette .callbtn{background:var(--grass);box-shadow:0 4px 0 var(--grassDk)}
.loop{border:3px solid var(--sun);border-radius:16px;background:#FFF6DC;padding:6px;display:flex;flex-direction:column;gap:6px;min-width:150px;flex:1 1 180px}
.loop.now{box-shadow:0 0 0 3px var(--sunDk)}
.loophead{display:flex;align-items:center;gap:6px;font-weight:800;font-size:14px;flex-wrap:wrap}
.loophead button{width:30px;height:30px;border-radius:10px;border:2px solid var(--sunDk);background:var(--card);font-weight:800}
.loophead .n{font-family:var(--display);font-size:22px;min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.loophead .x{margin-left:auto;border-color:var(--line)}
.loop .tray{min-height:60px;background:var(--card)}
.fnbox{width:100%;border:3px solid var(--grass);border-radius:16px;background:#E8F8EF;padding:6px;display:grid;gap:6px}
.fnbox .tray{background:var(--card);min-height:60px}
.counter{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;text-align:center}

/* result bar */
.result{border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;animation:slide .25s ease-out}
.result.ok{background:#D9F7E6;color:var(--grassDk)}
.result.bad{background:#FFE2DE;color:var(--coralDk)}
.result div{display:flex;flex-direction:column;min-width:0}
.result strong{font-family:var(--display);font-size:22px}
.result span{font-weight:700}
@keyframes slide{from{transform:translateY(10px);opacity:.3}}

/* shared bits */
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--grass)}
.choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.choice{min-width:76px;height:76px;padding:0 10px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-size:40px}
.choice.numc{font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums}
.choice:disabled{opacity:.5}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.stage{width:100%;min-height:110px;border-radius:18px;background:#F3F0FF;display:flex;align-items:center;justify-content:center;gap:18px;font-size:56px;line-height:1}
.pop{animation:pop .45s}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.2)}}

/* A2 pattern train: one row that scales to the card; engine + wagons on a track */
.trainwrap{width:100%;container-type:inline-size;padding-top:6px}
.train{display:grid;grid-template-columns:1.25fr repeat(var(--n),1fr);gap:1.4%;align-items:end;width:100%}
.loco svg{width:100%;display:block;overflow:visible}
.loco .body{fill:var(--coral)}.loco .cab{fill:var(--coralDk)}.loco .roof,.loco .dk{fill:var(--ink)}.loco .win{fill:#DFF1FF}.loco .hub{fill:var(--sun)}
.loco .puff{fill:#C9D6E8;animation:puff 2s ease-out infinite}
@keyframes puff{0%{transform:translate(0,4px) scale(.4);opacity:.9}100%{transform:translate(-6px,-10px) scale(1.4);opacity:0}}
.train.go{animation:chug .9s ease-in-out 2}
@keyframes chug{50%{transform:translateX(-3%)}}
.wagon{position:relative;aspect-ratio:1/1.3}
.wagon::before{content:"";position:absolute;left:-14%;top:58%;width:16%;height:6%;background:var(--ink);border-radius:2px}
.wbody{position:absolute;left:2%;right:2%;top:2%;bottom:18%;border-radius:14% 14% 8% 8%;display:grid;place-items:center;background:linear-gradient(to bottom,var(--c) 72%,var(--cd) 72%)}
.cargo{width:84%;aspect-ratio:1;border-radius:18%;background:#fff;display:grid;place-items:center;font-size:calc(100cqw / (var(--n) + 1.25) * .6);line-height:1;margin-top:-14%}
.wheel{position:absolute;bottom:2%;width:28%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,var(--sun) 0 22%,var(--ink) 24%)}
.wheel.l{left:10%}.wheel.r{right:10%}
.wagon.sea{--c:var(--sea);--cd:var(--seaDk)}.wagon.grass{--c:var(--grass);--cd:var(--grassDk)}.wagon.grape{--c:var(--grape);--cd:var(--grapeDk)}.wagon.sun{--c:var(--sun);--cd:var(--sunDk)}
.wagon.q .wbody{background:#F3F0FF;border:3px dashed var(--grape)}
.wagon.q .cargo{background:none;color:var(--grape);font-family:var(--display);font-weight:800}
.rails{height:10px;margin-top:-4px;border-top:3px solid #8C97B3;background:repeating-linear-gradient(90deg,#B9A58A 0 6px,transparent 6px 16px)}
/* A3 seed steps */
.slots,.cards{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:8px;width:100%}
.slot{aspect-ratio:1;border:3px dashed var(--line);border-radius:16px;display:grid;place-items:center;font-size:36px;position:relative;background:var(--soft)}
.slot b{position:absolute;top:4px;left:8px;font-family:var(--display);font-size:16px;color:var(--muted)}
.slot.full{border-style:solid;border-color:var(--grass);background:var(--card)}
.slot.wrong{border-color:var(--coral)}
.pcard{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-size:36px}
.pcard[disabled]{visibility:hidden}

/* A4 hop twice */
.hop3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.hslot{border:3px dashed var(--line);border-radius:16px;min-height:124px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:6px;background:var(--soft)}
.hslot.full{border-style:solid;border-color:var(--grape);background:var(--card)}
.hslot.now{border-color:var(--sunDk);background:#FFF6DC}
.cnt{display:flex;align-items:center;gap:4px}
.cnt button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-weight:800;font-size:18px}
.cnt b{font-size:13px;letter-spacing:1px;color:var(--grapeDk);min-width:36px;text-align:center}

/* A5 weather bear */
.rules{display:grid;gap:8px;width:100%}
.rrow{display:flex;align-items:center;gap:10px;justify-content:center;font-size:36px}
.rrow .kw{font-family:var(--display);font-size:16px;font-weight:800;color:var(--grapeDk)}
.rslot{width:68px;height:68px;border:3px dashed var(--line);border-radius:16px;background:var(--soft);font-size:36px;display:grid;place-items:center}
.rslot.sel{border-color:var(--grape);border-style:solid;background:#F3F0FF}
.rslot.wrong{border-color:var(--coral);border-style:solid;background:#FFE2DE}

/* A6 copy the dance */
.seqrow{display:flex;gap:6px;min-height:44px;font-size:32px;flex-wrap:wrap;justify-content:center}

/* B3/B5 sorters */
.belt{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:44px}
.item svg{width:40px;height:40px;display:block}
.item.wrong,.num.wrong{outline:3px solid var(--coral);border-radius:10px}
.rule{width:100%;border-radius:16px;background:#F3F0FF;border:2px solid #DCD3FF;padding:12px;display:grid;gap:8px;font-weight:800}
.rule .kw{font-family:var(--display);color:var(--grapeDk);font-size:18px;margin-right:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:12px;padding:5px 10px;font-weight:800;display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{border-color:var(--grape);background:#EEEAFF}
.chip svg{width:18px;height:18px}
.baskets{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.baskets.three{grid-template-columns:1fr 1fr 1fr;gap:6px}
.basket{border:3px solid var(--line);border-radius:16px;min-height:96px;padding:8px;display:flex;flex-direction:column;gap:6px;min-width:0}
.basket h4{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.basket .in{display:flex;flex-wrap:wrap;gap:4px}
.goal{width:100%;text-align:center;font-weight:800;background:#FFF6DC;border-radius:14px;padding:8px}
.num{border:2px solid var(--line);border-bottom-width:4px;background:var(--card);border-radius:12px;padding:4px 10px;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.num[aria-pressed="true"]{border-color:var(--grape);background:#EEEAFF}
.pairs{font-weight:700;color:var(--muted);font-size:14px;min-height:1.4em}
.pairs i{font-style:normal;letter-spacing:1px;color:var(--grapeDk)}
.pairs i.left{color:var(--coral)}

/* B4 tower counter: light grid lines every block, numbered on the left */
.towerwrap{position:relative;width:100%;padding-left:24px}
.axis{position:absolute;left:0;bottom:3px;width:20px;height:144px;font-size:11px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.axis span{position:absolute;right:0;bottom:calc(var(--k) * 16px - 7px);height:14px;line-height:14px;text-align:right}
.axis span::after{content:"";position:absolute;right:-6px;top:6px;width:4px;height:2px;background:#C9D6EA}
.towers{display:flex;gap:6px;align-items:flex-end;justify-content:center;height:147px;width:100%;border-bottom:3px solid var(--line);
  background-image:repeating-linear-gradient(to top,transparent 0 15px,#E3ECF8 15px 16px);background-position:bottom;background-origin:content-box}
.tw{position:relative;flex:1 1 0;max-width:32px;min-width:0;height:100%}
.tw .ghost,.tw .solid{position:absolute;left:0;right:0;bottom:0;border-radius:6px 6px 0 0}
.tw .ghost{border:2px dashed var(--grape);border-bottom:0}
.tw .solid{background:repeating-linear-gradient(to top,var(--sun) 0 14px,var(--sunDk) 14px 16px);transition:height .3s;height:0}
.tw .solid.bad{background:repeating-linear-gradient(to top,var(--coral) 0 14px,var(--coralDk) 14px 16px)}
.countbox{font-family:var(--display);font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-weight:800;font-size:18px}
.stepper b{font-family:var(--display);font-size:22px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}

/* B9 magic jar */
.codepanel{width:100%;background:var(--ink);color:#fff;border-radius:14px;padding:10px;display:grid;gap:4px;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px}
.codepanel div{padding:3px 8px;border-radius:8px}
.codepanel .in1{padding-left:30px}
.codepanel .now{background:var(--sun);color:var(--ink)}
.jar{display:flex;align-items:center;gap:10px;font-size:44px}
.jar b{font-family:var(--display);font-size:40px;min-width:70px;text-align:center;background:#FFF6DC;border-radius:14px;padding:0 10px;font-variant-numeric:tabular-nums}
.q{margin:0;font-weight:800}

/* B6 place value */
.mat{width:100%;display:grid;grid-template-columns:28px 1fr 1fr;gap:6px;align-items:stretch}
.mat .h{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.mat .col{position:relative;min-height:64px;border-radius:12px;background:var(--soft);border:2px solid var(--line);padding:18px 6px 6px;display:flex;flex-wrap:wrap;gap:3px;align-content:flex-end;justify-content:center}
.mat .col small{position:absolute;top:2px;left:8px;font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.mat .col.over{border-color:var(--coral);background:#FFE2DE}
.mat .sign{font-family:var(--display);font-size:24px;font-weight:800;display:grid;place-items:center}
.mat .line{grid-column:1/-1;border-top:3px solid var(--ink)}
.rod{width:9px;height:50px;border-radius:3px;background:repeating-linear-gradient(to top,var(--sea) 0 4px,var(--seaDk) 4px 5px)}
.cube{width:11px;height:11px;border-radius:2px;background:var(--sun);box-shadow:inset 0 -2px 0 var(--sunDk)}
.algo{margin:0;padding-left:22px;display:grid;gap:2px;font-weight:700;width:100%;font-size:15px}
.algo li.done{color:var(--grassDk)}
.algo li.done::after{content:" ✓"}

/* B7 mirror numbers */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.tiles .num{padding:12px 4px;font-size:22px}
.bignum{font-family:var(--display);font-size:52px;font-weight:800;letter-spacing:.08em;font-variant-numeric:tabular-nums;line-height:1}
.log{width:100%;font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted);display:grid;gap:2px;text-align:center;min-height:1.4em}

/* B10 draw bot */
.paper{width:min(100%,300px)}
.paper svg{width:100%;display:block;background:var(--card);border:3px solid var(--line);border-radius:16px}
.paper .dotg circle{fill:var(--line)}
.paper .tgt line{stroke:#BDB0FF;stroke-width:7;stroke-dasharray:7 7;stroke-linecap:round}
.paper .ink line{stroke:var(--coral);stroke-width:7;stroke-linecap:round}
.paper .turtle{transition:transform .3s ease}
.paper .turtle polygon{fill:var(--grass);stroke:var(--grassDk);stroke-width:2}

/* shell */
.panel h3{font-size:24px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.ptile{border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;background:var(--card);padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;min-width:0;overflow-wrap:anywhere}
.ptile .av{font-size:40px}
.ptile small{color:var(--muted);font-weight:700}
.ptile[aria-pressed="true"]{border-color:var(--grass);background:#EAF9F0}
.ptile.add{border-style:dashed;color:var(--muted)}
.form{display:grid;gap:10px;border-top:2px dashed var(--line);padding-top:12px}
.form label{font-weight:800;font-size:14px}
.form input{width:100%;font:inherit;font-weight:700;padding:10px 12px;border:2px solid var(--line);border-radius:12px}
.avs,.ages,.opts{display:flex;flex-wrap:wrap;gap:6px}
.avs button{width:48px;height:48px;font-size:28px;border-radius:12px;border:2px solid var(--line);background:var(--card)}
.avs button[aria-pressed="true"],.ages button[aria-pressed="true"],.opts button[aria-pressed="true"]{border-color:var(--grass);background:#EAF9F0}
.ages button,.opts button{border:2px solid var(--line);border-radius:12px;background:var(--card);padding:8px 14px;font-weight:800}
.err{color:var(--coralDk);font-weight:700;font-size:14px;min-height:1em;margin:0}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:8px}
.unit{width:100%;border-radius:16px;background:var(--grass);color:#fff;padding:12px 16px}
.unit.older{background:var(--grape)}
.unit h4{margin:0;font-family:var(--display);font-size:20px}
.unit p{margin:0;font-weight:700;opacity:.9;font-size:14px}
.node{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none}
.node .dot{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:32px;background:var(--grass);box-shadow:0 6px 0 var(--grassDk)}
.node.done .dot{background:var(--sun);box-shadow:0 6px 0 var(--sunDk)}
.node.current .dot{animation:bob 1.4s ease-in-out infinite}
.node span{font-weight:800;font-size:14px}
.node small{font-size:13px;color:var(--sunDk);min-height:1em}
@keyframes bob{50%{transform:translateY(-5px)}}
.shellgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px;align-items:start}

/* grown-up modal + PIN pad */
.modal{position:fixed;inset:0;z-index:50;background:rgba(29,40,70,.6);display:grid;place-items:center;padding:16px}
.sheet{background:var(--card);border-radius:24px;padding:22px;width:min(100%,380px);display:grid;gap:12px;text-align:center;max-height:100%;overflow:auto}
.sheet h2{font-size:26px}
.sheet p{margin:0;color:var(--muted);font-weight:700}
.sheet .big{font-size:56px;line-height:1}
.pindots{display:flex;gap:14px;justify-content:center}
.pindots i{width:18px;height:18px;border-radius:50%;border:3px solid var(--grape)}
.pindots i.on{background:var(--grape)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{height:56px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-family:var(--display);font-size:24px;font-weight:800}
.settings{display:grid;gap:12px;text-align:left}
.settings h4{margin:0;font-size:14px;font-weight:800}
.settings .row{display:grid;gap:6px}
.settings .opts{gap:6px}

@media (max-width:520px){
  .navbtn{min-width:0;flex:1}
  .hello h2{font-size:26px}
  .tag,.gtxt{display:none}
  .brand{font-size:19px}
  .topin{padding-block:8px}
  .chipbtn{padding:5px 8px;font-size:14px}
}

/* ---- v3: home ---- */
.hello{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;margin-bottom:20px}
.hello .av.big{font-size:56px;line-height:1}
.hello .hi{flex:1 1 200px;min-width:0}
.hello h2{font-size:32px}
.hello p{margin:2px 0 0;color:var(--muted);font-weight:700}
.btn.big{font-size:22px;padding:16px 30px;border-radius:20px}
.homegrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}
.ptile{position:relative;padding:0;display:block}
.ptile .pselect{width:100%;border:0;background:none;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;border-radius:16px}
.ptile.on{border-color:var(--grass);background:#EAF9F0}
.ptile .nm{overflow-wrap:anywhere}
.pedit{position:absolute;top:6px;right:6px;width:32px;height:32px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-size:14px}
.linkbtn{border:0;background:none;color:var(--grapeDk);font-weight:800;text-decoration:underline;padding:6px 0;margin-top:6px}
.fine{margin:0;color:var(--muted);font-size:14px;font-weight:600}

/* ---- v3: deck ---- */
.deckwrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.decktop{display:flex;align-items:center;gap:12px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:14px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-size:18px;font-weight:800;color:var(--muted)}
.progress{flex:1;display:flex;gap:4px;min-width:0}
.seg{flex:1;height:14px;border-radius:999px;border:0;background:var(--line);padding:0;min-width:6px}
.seg.s1,.seg.s2{background:#FFD978}.seg.s3{background:var(--sun)}
.seg.here{box-shadow:0 0 0 3px var(--grape)}
.pos{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px;flex:none}
.unitname{font-size:13px;font-weight:800;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em}
.stack{overflow-x:clip;overflow-y:visible;padding-bottom:8px}
.card{box-shadow:0 8px 0 var(--line)}
.card.in-next{animation:inNext .35s ease-out}
.card.in-prev{animation:inPrev .35s ease-out}
@keyframes inNext{from{transform:translateX(40px) rotate(2deg);opacity:0}}
@keyframes inPrev{from{transform:translateX(-40px) rotate(-2deg);opacity:0}}
.best{margin-left:auto;font-size:14px;letter-spacing:1px;white-space:nowrap}
.best+.speak{margin-left:0}
.decknav{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:10}
.navbtn{box-shadow:0 6px 16px rgba(29,40,70,.18)}
.navbtn{min-width:120px;height:56px;border-radius:18px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-family:var(--display);font-size:20px;font-weight:800;color:var(--ink);padding:0 18px}
.navbtn.next{background:var(--grape);border-color:var(--grapeDk);color:#fff}
.navbtn:disabled{opacity:.35;cursor:default}
.result .rtext{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.result .rbtns{display:flex;gap:8px;flex-wrap:wrap}
.result .stars{letter-spacing:2px}
.result .combo{color:var(--grapeDk)}

/* ---- v3: robot heading + voice ---- */
.sprite>span{display:grid;place-items:center}
.hdring{position:absolute;inset:0;transition:transform .3s ease;pointer-events:none}
.hdring::before{content:"";position:absolute;top:2%;left:50%;transform:translateX(-50%);border:solid transparent;border-width:0 9px 12px;border-bottom-color:var(--coral)}
.mic{width:100%;display:flex;align-items:center;gap:12px;background:#F3F0FF;border-radius:18px;padding:10px 12px}
.micbtn{width:64px;height:64px;flex:none;border-radius:50%;border:0;background:var(--grape);box-shadow:0 5px 0 var(--grapeDk);font-size:30px}
.mic[data-state="on"] .micbtn{background:var(--coral);box-shadow:0 5px 0 var(--coralDk);animation:pulse 1.2s ease-in-out infinite}
.mic[data-state="blocked"] .micbtn,.mic[data-state="unsupported"] .micbtn{opacity:.45}
@keyframes pulse{50%{transform:scale(1.08)}}
.heard{margin:0;font-weight:800;color:var(--grapeDk);min-width:0}
.saylabel{margin:0;font-weight:800;color:var(--muted);font-size:14px}
.blk.wide{width:auto;padding:0 14px;font-size:20px}

/* ---- v3: settings ---- */
.lbl{font-weight:800;font-size:14px;text-align:left}
.field{width:100%;font:inherit;font-weight:700;padding:10px 12px;border:2px solid var(--line);border-radius:12px}
.sheet .avs{justify-content:center}
.kidrows{display:grid;gap:8px}
.kidrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:2px solid var(--line);border-radius:14px;padding:8px}
.kidrow .av{font-size:26px}
.kidrow .tleft{font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.addrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.addrow input{flex:1 1 140px;min-width:0;font:inherit;font-weight:700;padding:9px 12px;border:2px solid var(--line);border-radius:12px}
.sheet{width:min(100%,460px)}
.sheet .settings p{text-align:left}

/* ---- v3.1: solution key + hints ---- */
.stuck{align-self:center;border:2px dashed var(--sunDk);background:#FFF6DC;color:var(--ink);font-weight:800;border-radius:14px;padding:8px 14px}
.keybox{border-radius:16px;background:#FFF6DC;border:2px solid var(--sun);padding:12px 14px;display:grid;gap:6px;font-weight:700}
.keybox strong{font-family:var(--display);font-size:20px}
.keybox small{color:var(--muted)}
.kg{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 4px;border-radius:8px;background:var(--grape);color:#fff;font-family:var(--display)}
.kg.call{background:var(--grass)}
.kloop{display:inline-flex;gap:4px;align-items:center;border:2px solid var(--sun);border-radius:10px;padding:2px 6px;background:#fff}
.kbig{font-size:26px;letter-spacing:2px}
.hint{animation:glow 1s ease-in-out infinite;border-color:var(--sun)!important}
.cell.hint{background:#FFE9A8}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,194,60,.55)}}

/* ---- v3.2: clearer instructions ---- */
.goalline{margin:0;font-family:var(--display);font-size:22px;font-weight:800;line-height:1.2}
.steps{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;font-size:17px;font-weight:700;line-height:1.3}
.steps li::before{content:counter(st);display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--grape);color:#fff;font-family:var(--display);font-weight:800}
.card[data-tier="young"] .goalline{font-size:26px}
.card[data-tier="young"] .steps li{font-size:19px}
.newbadge{position:absolute;margin-top:-6px;margin-left:56px;font-style:normal;font-size:11px;font-weight:800;letter-spacing:.06em;background:var(--coral);color:#fff;border-radius:999px;padding:2px 8px}
.node{position:relative}
.newnote{color:var(--coralDk)!important}
.savewarn{background:#FFE2DE;border:2px solid var(--coral);color:var(--coralDk);border-radius:14px;padding:10px 14px;font-weight:800;margin:0 0 16px}
textarea.field{resize:vertical;font-size:13px}

/* ---- v3.2: ages 4-6 games ---- */
.rtitle{margin:0;font-family:var(--display);font-size:22px;font-weight:800}
.prompt{margin:0;font-weight:800;color:var(--muted);text-align:center;min-height:1.4em}
.stepsrow{display:flex;align-items:center;justify-content:center;gap:4px;width:100%}
.scard{position:relative;flex:1 1 0;max-width:78px;aspect-ratio:1;border-radius:16px;border:3px solid var(--line);border-bottom-width:6px;background:var(--card);display:grid;place-items:center;font-size:clamp(26px,9vw,40px);padding:0}
.scard b{position:absolute;top:2px;left:6px;font-family:var(--display);font-size:13px;color:var(--muted)}
.scard.bug{border-color:var(--coral);background:#FFE2DE;animation:wobble .6s}
.scard.fixed{border-color:var(--grass);background:#EAF9F0}
.sarrow{color:var(--muted);font-weight:800;font-size:18px}
.hint{animation:glow 1s ease-in-out infinite;border-color:var(--sun)!important}
.lgoal{display:flex;align-items:center;gap:12px;background:#F3F0FF;border-radius:18px;padding:10px 14px;width:100%}
.lbig{font-family:var(--display);font-weight:800;font-size:34px;background:var(--grape);color:#fff;border-radius:14px;padding:0 14px;min-width:84px;text-align:center;line-height:1.4}
.ltext{font-weight:800;color:var(--grapeDk)}
.wordtiles{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.ltile{position:relative;display:grid;place-items:center;line-height:1;width:clamp(34px,10vw,48px);height:clamp(44px,13vw,60px);border-radius:12px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-family:var(--display);font-weight:800;font-size:clamp(22px,7vw,32px);padding:0}
.ltile.hit{background:var(--sun);border-color:var(--sunDk)}
.ltile.cur{outline:3px solid var(--grape)}
.ltile i{position:absolute;top:-8px;right:-6px;font-style:normal;font-size:13px;min-width:20px;height:20px;border-radius:50%;background:var(--grass);color:#fff;display:grid;place-items:center}
.lfound{font-family:var(--display);font-weight:800;font-size:22px;min-height:1.4em;text-align:center}
.gluepic{display:flex;align-items:center;justify-content:center;gap:12px}
.gp{font-size:64px;line-height:1}.gw{font-family:var(--display);font-weight:800;font-size:26px;color:var(--grapeDk)}
.glueslots{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.gslot{min-width:96px;padding:12px 14px;border-radius:16px;border:3px dashed var(--line);background:var(--soft);font-family:var(--display);font-weight:800;font-size:28px;text-align:center;color:var(--muted)}
.gslot.full{border:3px solid var(--grass);background:#EAF9F0;color:var(--grassDk)}
.gslot.done{border:3px solid var(--sun);background:#FFF6DC;color:var(--ink);font-size:36px}
.gplus{font-family:var(--display);font-weight:800;font-size:28px;color:var(--muted)}
.gtile{font-family:var(--display);font-weight:800;font-size:24px}
.sumline{display:flex;gap:12px;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:46px;font-variant-numeric:tabular-nums;line-height:1}
.sumline span{color:var(--grapeDk)}.sumline .q{color:var(--coral)}
.sumstage{display:flex;align-items:center;justify-content:center;gap:14px;min-height:96px;width:100%;background:#F3F0FF;border-radius:18px;padding:12px;flex-wrap:wrap}
.grp{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:46%}
.grp.basket{width:100%;max-width:100%;justify-content:center;border:3px solid #C9A877;border-top:0;border-radius:6px 6px 22px 22px;background:#F2E2C4;padding:10px 12px}
.it{font-style:normal;font-size:clamp(28px,8vw,38px);line-height:1;transition:opacity .3s,transform .3s}
.it.pre{opacity:0;transform:scale(.3)}
.it.gone{opacity:.15;transform:scale(.6);filter:grayscale(1)}
.eater{font-size:54px}
.mstat{display:flex;justify-content:space-between;width:100%;font-weight:800;color:var(--muted);font-size:14px}
.mgrid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:8px;width:100%}
.mcard{aspect-ratio:1;border-radius:16px;border:3px solid var(--grapeDk);border-bottom-width:6px;background:var(--grape);color:#fff;display:grid;place-items:center;font-size:clamp(28px,9vw,44px);padding:0}
.mcard .face{display:none}.mcard.up .face{display:block}.mcard.up .back{display:none}
.mcard.up{background:var(--card);border-color:var(--line)}
.mcard.ok{background:#EAF9F0;border-color:var(--grass)}
.rmon{display:flex;align-items:center;gap:12px;width:100%;background:#F3F0FF;border-radius:18px;padding:10px 14px}
.monster{font-size:60px;line-height:1}
.rsay{font-weight:800;color:var(--grapeDk);font-size:18px}
.ritems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.ritem{border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);padding:8px 4px;display:grid;gap:2px;justify-items:center}
.ritem span{font-size:clamp(30px,9vw,42px);line-height:1}.ritem small{font-weight:800;font-size:14px}
.ritem.fed{background:#EAF9F0;border-color:var(--grass);opacity:.6}

/* ---- v3.2: ages 7-8 games ---- */
.luckybox{display:flex;align-items:center;gap:10px;font-size:46px}
.luckybox b{font-family:var(--display);min-width:90px;text-align:center;background:#EAF9F0;border:3px solid var(--grass);border-radius:16px}
.rangewrap{width:100%;display:grid;gap:4px}
.rangebar{height:16px;border-radius:999px;background:var(--line);position:relative;overflow:hidden}
.rfill{position:absolute;top:0;bottom:0;background:var(--grass);border-radius:999px;transition:left .3s,width .3s}
.rangelbl{font-weight:700;text-align:center}
.gpick{display:flex;align-items:center;gap:8px;justify-content:center}
.gpick button{min-width:46px;height:46px;border-radius:12px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-weight:800;font-size:16px}
.gv{font-family:var(--display);font-size:44px;min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.glog{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:30px}
.gchip{border-radius:999px;padding:3px 10px;font-weight:800;background:#F3F0FF;color:var(--grapeDk);font-variant-numeric:tabular-nums}
.gchip.up{background:#FFF6DC;color:var(--sunDk)}.gchip.dn{background:#E8F1FF;color:var(--seaDk)}
.rgoal{margin:0;font-weight:800;font-size:18px;text-align:center}
.reelbox{width:140px;height:96px;border-radius:20px;background:var(--ink);display:grid;place-items:center;border:4px solid var(--grapeDk)}
.reel{font-family:var(--display);font-weight:800;font-size:58px;color:var(--sun);line-height:1;font-variant-numeric:tabular-nums}
.rngctl{display:grid;gap:8px;font-weight:800}
.rngctl>div{display:flex;align-items:center;gap:10px;justify-content:space-between}
.rollrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:28px}
.rinfo{text-align:center}
.vmsg{margin:0;font-weight:800;text-align:center;min-height:2.6em}
.vgrid{display:grid;grid-template-columns:repeat(var(--cols,4),1fr);gap:8px;width:100%}
.locker{position:relative;aspect-ratio:1;border-radius:14px;border:3px solid #7B86A3;border-bottom-width:6px;background:#AAB4CC;display:grid;place-items:center;font-size:clamp(28px,9vw,42px)}
.locker b{position:absolute;top:2px;left:8px;font-family:var(--display);font-size:15px;color:var(--ink)}
.locker.open{background:var(--card);border-color:var(--line)}
.vbar{width:100%;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:var(--sun)}
.bugcode{gap:6px}
.cline{display:flex;gap:10px;align-items:center;text-align:left;width:100%;border:0;border-radius:8px;background:transparent;color:#fff;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:15px;padding:5px 8px}
.cline b{color:#9AA7C7;min-width:14px}
.cline.sel{background:#4B3FB5}.cline.now{background:var(--sun);color:var(--ink)}
.fixopts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;font-weight:800}
.vres{margin:0;font-weight:800;min-height:1.4em;text-align:center}.vres.ok{color:var(--grassDk)}.vres.bad{color:var(--coralDk)}
.lcode .in1{padding-left:22px}.lcode .in2{padding-left:44px}
.lcount{font-family:var(--display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums}
.joined{min-height:44px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:22px;font-weight:800;color:var(--grapeDk)}
.cch{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:18px;font-weight:800}
.hgoal{margin:0;font-size:20px;font-weight:800;text-align:center}
.tnum{font-family:var(--display);font-size:34px;color:var(--coral)}
.hflips{font-weight:800;color:var(--muted);font-size:14px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;width:100%}
.ncard{aspect-ratio:1;border-radius:12px;border:3px solid var(--sea);border-bottom-width:6px;background:var(--sea);color:#fff;font-family:var(--display);font-weight:800;font-size:22px;padding:0;font-variant-numeric:tabular-nums}
.ncard.up{background:var(--card);color:var(--ink);border-color:var(--line)}
.ncard.found{background:var(--sun);border-color:var(--sunDk)}
.ncard.out:not(.up){opacity:.35}
.hhint{margin:0;font-weight:800;text-align:center;min-height:2.6em}
.shelf{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:100%}
.abox{width:clamp(58px,17vw,76px);border-radius:14px;border:3px solid var(--line);border-bottom-width:6px;background:var(--card);padding:6px 2px;display:grid;justify-items:center;gap:2px}
.abox span{font-size:clamp(28px,9vw,38px);line-height:1}.abox small{font-weight:800;font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.abox.ghost{border-style:dashed}.abox.ok{border-color:var(--grass);background:#EAF9F0}
.ajob{margin:0;font-weight:800;text-align:center;min-height:2.6em}
.choice.sel{border-color:var(--grape);background:#F3F0FF}
.tpwrap{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%}
.tpcol{display:grid;gap:4px;justify-items:center}.tpcol h5{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tpgrid{display:grid;grid-template-columns:repeat(var(--cols),auto);gap:4px;align-items:center}
.tpcell{width:clamp(38px,11vw,50px);height:clamp(38px,11vw,50px);display:grid;place-items:center;border-radius:10px;font-family:var(--display);font-weight:800;font-size:clamp(18px,6vw,26px);background:var(--card);border:2px solid var(--line)}
.tpcell.d.empty{background:var(--soft);border-style:dashed}
.tpcell.dim{opacity:.35}.tpcell.probe{border-color:var(--sunDk);background:#FFF6DC;animation:glow 1s ease-in-out infinite}
.tprow,.tphead{border-radius:10px;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);font-weight:800;font-size:12px;padding:6px 4px;white-space:nowrap}
.tprow.sel{border-color:var(--grape);background:#F3F0FF}.tprow.done{opacity:.4}
.tphead{height:auto;min-height:32px}

/* ---- v3.3 ---- */
.codepanel .in2{padding-left:52px}.codepanel .in3{padding-left:74px}
.board.chk .cell{background:#F3E3C7;border-color:transparent}
.board.chk .cell.dk{background:#B98A5E}
.board.chk .sprite span{color:var(--ink);text-shadow:0 0 3px #fff,0 0 6px #fff,0 0 10px #fff;font-size:115%}
.board.chk .cell.picked{background:#FFE9A8}.board.chk .cell.right{background:#BFF0D4}.board.chk .cell.hint{background:#FFE9A8}
.fnshow:empty{display:none}
.kfn{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-weight:800;border:3px solid var(--grass);background:#E8F8EF;border-radius:14px;padding:6px 10px}
.kloop.pl{gap:6px;padding:4px 8px;font-weight:800;border-width:3px}
.kloop.pl.now{box-shadow:0 0 0 3px var(--sunDk)}
.lrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:52px;width:100%;padding:6px;border-radius:14px}
.lrow.target{background:#F3F0FF}
.lrow.perform{background:#EAF9F0}
.li{font-size:clamp(26px,8vw,36px);line-height:1.2;border-radius:10px;padding:0 2px}
.li.now{background:var(--sun)}
.loopmaker{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;border:3px solid var(--sun);background:#FFF6DC;border-radius:16px;padding:10px;font-weight:800}
.lslots{display:flex;gap:6px}
.lslot{width:56px;height:56px;border-radius:14px;border:3px dashed var(--sunDk);background:var(--card);font-size:30px;padding:0}
.lslot.full{border-style:solid}
.mwrow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mwrow.back{padding-top:10px;border-top:3px dashed var(--line)}
.mwt{width:clamp(48px,14vw,64px);height:clamp(56px,16vw,72px);border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:clamp(30px,9vw,42px);line-height:1;color:#fff;background:var(--c);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.choice.wide{min-width:0;height:auto;padding:12px 16px;font-size:18px;font-weight:800}
.pfield{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;width:100%}
.pitem{width:64px;height:64px;border-radius:16px;border:2px solid var(--line);border-bottom-width:5px;background:var(--card);font-size:36px;padding:0}
.pitem.sel{border-color:var(--grape);background:#F3F0FF;transform:translateY(-4px)}
.pairs-out{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.pbox{font-size:30px;border:3px solid var(--grass);background:#EAF9F0;border-radius:14px;padding:2px 8px;letter-spacing:2px}
.dstrip{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;width:100%;min-height:76px;padding:10px 14px;border:3px dashed var(--line);border-radius:16px;background:var(--soft)}
.dstrip.empty::before{content:"Drop pieces here";color:var(--muted);font-weight:700;font-size:14px}
.dstrip.over{border-color:var(--grape);background:#F3F0FF}
.dpal{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.pz{position:relative;display:inline-grid;place-items:center;width:56px;height:52px;margin-right:12px;border-radius:10px;background:var(--sea);box-shadow:0 4px 0 var(--seaDk);color:#fff;font-family:var(--display);font-weight:800;font-size:28px;touch-action:none;user-select:none;cursor:grab}
.pz::after{content:"";position:absolute;right:-10px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:inherit}
.pz.in{background:var(--grape);box-shadow:0 4px 0 var(--grapeDk)}
.pz.now{background:var(--sun);color:var(--ink)}.pz.bad{background:var(--coral)}
.pz.ghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);opacity:.9}
.dhint{text-align:center;margin:0}
.vboxes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.vbox{display:grid;justify-items:center;border:3px solid var(--sun);background:#FFF6DC;border-radius:14px;padding:4px 14px;min-width:70px}
.vbox small{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;color:var(--muted)}
.vbox b{font-family:var(--display);font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1}
.basket.ex{min-height:0}.basket.ex h4{font-size:12px}
.rparam{display:flex;align-items:center;gap:8px}

/* ---- v3.3 phone fixes ---- */
.progress{overflow:hidden}
.seg{min-width:0}
.slot,.pcard{min-width:0;padding:0;font-size:clamp(22px,7.5vw,36px)}
.hop3>.hslot{min-width:0}
.cnt{flex-wrap:wrap;justify-content:center}
.cnt b{min-width:0;font-size:11px;letter-spacing:0}
.unitpos{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap}

@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
